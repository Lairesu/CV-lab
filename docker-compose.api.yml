services:
  api:
    build:
      context: ./projects/smart-canteen/backend

    ports:
      - "127.0.0.1:8100:8000"

    environment:
      SMART_CANTEEN_ADMIN_KEY: ${SMART_CANTEEN_ADMIN_KEY:?Admin key missing}
      SMART_CANTEEN_WORKER_KEY: ${SMART_CANTEEN_WORKER_KEY:?Worker key missing}
    volumes:
      - smart_canteen_data:/data
      - ./projects/smart-canteen/media:/media

    restart: unless-stopped

volumes:
  smart_canteen_data:
